<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ふろ場日記</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#10161F">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 画面1: 合言葉ロック -->
<section id="gate-screen" class="screen">
  <h1>ふろ場日記</h1>
  <p class="hint">合言葉を入力してください</p>
  <input type="password" id="passphrase-input" inputmode="text" autocomplete="off" placeholder="合言葉">
  <button id="gate-submit" class="big-button">入る</button>
  <p id="gate-error" class="error" hidden>合言葉が違います</p>
</section>

<!-- 画面2: 初回のみ、GitHubトークン設定 -->
<section id="setup-screen" class="screen" hidden>
  <h1>はじめの設定</h1>
  <p class="hint">GitHubで発行した「アクセス用の鍵(トークン)」を貼り付けてください。この端末に保存され、以後は自動で使われます。</p>
  <textarea id="token-input" rows="3" placeholder="ghp_... または github_pat_..."></textarea>
  <button id="setup-submit" class="big-button">保存して始める</button>
  <p id="setup-error" class="error" hidden></p>
</section>

<!-- 画面3: メモ入力(メイン画面) -->
<section id="main-screen" class="screen" hidden>
  <h1>ふろ場日記</h1>
  <p class="hint" id="today-label"></p>

  <div id="live-transcript" class="live-transcript" hidden></div>

  <textarea id="note-input" rows="10" placeholder="読み込み中..."></textarea>

  <div class="button-row">
    <button id="mic-button" class="big-button mic">🎙️ 話す</button>
  </div>

  <button id="save-button" class="big-button primary">保存する</button>

  <p id="status-message" class="status" hidden></p>

  <button id="settings-button" class="link-button">設定を変える</button>
</section>

<script src="app.js" defer></script>
</body>
</html>
